# DRINK-WATER — pick up the bottle, open, drink, close, put it back
#
# The camera is taught only what it cannot measure: whether the cap is on.
# Train two states of YOUR bottle in the Models tab, Objects mode ("Training
# for: Drink water from a bottle" creates them):
#
#   bottle_closed   your bottle with the cap ON  -- in your hand and standing
#   bottle_open     your bottle with the cap OFF -- the open neck visible
#   background      the scene WITHOUT the bottle: empty hands, fingers, face
#
# Everything else is measured, not learned. The stock detector finds "a
# bottle", body tracking finds your hands and when one is at your face, and the
# home spot is a region of the picture:
#
#   pick up        a hand on the bottle
#   open the cap   your trained model sees it open
#   drink          a hand at your face, the bottle in view
#   close the cap  your trained model sees it closed again
#   put it back    the bottle standing in the home spot for two seconds
#
# Home is the saffron box drawn on the camera view: stand the bottle inside it
# before you start, or move the rect below (fractions of the frame in the
# camera's true orientation: x0, y0, x1, y1). Run in Strict mode to have "put
# it back" before "close the cap" flagged out of sequence.
#
# No training at all? drink_water_body.yaml runs the same five steps from the
# stock detector and body tracking alone, reading open and close from both
# hands meeting at the bottle rather than from the cap itself.

procedure:
  id: drink_water
  name: Drink water from a bottle
  version: 2
  rack_markers: DICT_4X4_50
  vocabulary: custom

markers: []
regions:
  - id: home
    rect: [0.55, 0.45, 0.98, 0.98]

objects:
  # Whichever sees it: the stock "bottle" or one of your trained states.
  - id: bottle
    classes: [bottle, bottle_closed, bottle_open]

steps:
  - id: s1
    name: Pick up the bottle
    voice: "Step one. Pick up the bottle."
    preconditions: []
    requires:
      - contact: [hand, bottle]
        hold_frames: 4
    timeout_s: 90
    on_timeout: stall

  - id: s2
    name: Open the bottle cap
    voice: "Step two. Open the cap."
    preconditions: [s1]
    requires:
      - detect: bottle_open
        hold_frames: 6
    timeout_s: 90
    on_timeout: stall

  - id: s3
    name: Drink the water
    voice: "Step three. Take a drink."
    preconditions: [s2]
    requires:
      # About a second: a sip, not a hand passing the face.
      - gesture: hand_to_face
        hold_frames: 12
    any_of:
      # At the mouth the bottle is half hidden; one clear sighting will do.
      - detect: bottle_open
        hold_frames: 1
      - detect: bottle
        hold_frames: 1
    timeout_s: 90
    on_timeout: stall

  - id: s4
    name: Close the bottle cap
    voice: "Step four. Close the cap."
    preconditions: [s3]
    requires:
      - detect: bottle_closed
        hold_frames: 6
    timeout_s: 90
    on_timeout: stall

  - id: s5
    name: Put the bottle back in its place
    voice: "Step five. Put the bottle back in its place."
    preconditions: [s4]
    requires:
      - dwell: bottle
        region: home
        seconds: 2
    timeout_s: 90
    on_timeout: stall
