name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Invariant #2 (CLAUDE.md): perception and reasoning never import each other.
      - name: Architecture boundaries
        run: uv run lint-imports

      # Includes the golden replay corpus and the offline guard (invariant #1).
      - name: Tests
        run: uv run pytest -v

      - name: Procedures validate
        run: |
          uv run orbital-har validate proc_a
          uv run orbital-har validate proc_b
